<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <ul>
        <li><a href="index.html">Főoldal</a></li>
        <li><a href="tartozasok.html">Tartozások</a></li>
        <li class="active"><a href="tervek.html">Tervek</a></li>
    </ul>

    <div class="container">
        <h1>Tervek / Ötletek</h1>
        <div class="input">
            <input type="text" id="tervInput" placeholder="Írd be a tervet...">
            <input type="button" value="Hozzáad" onclick="add()">
        </div>
        <div class="tervek">
        </div>
    </div>

</body>
<script>
    // Itt adod meg a saját Supabase adataidat
    const SUPABASE_URL = 'https://bvositlxbeqztnhdembx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2b3NpdGx4YmVxenRuaGRlbWJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMTY3NzAsImV4cCI6MjEwMjc5Mjc3MH0.41fAH1kEGYYmXSmS0Ny4lkYuXe2N5_pSPX2VVKYzhkQ';

    // Inicializálás
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Amikor betöltődik az oldal, lekérjük az adatokat
    window.onload = function () {
        loadTervek();
    };

    // Adatok lekérése a Supabase-ből
    async function loadTervek() {
        const { data, error } = await _supabase
            .from('tervek')
            .select('*')
            .order('id', { ascending: false }); // A legújabb legyen felül

        if (error) {
            console.error('Hiba a betöltéskor:', error);
            return;
        }

        const container = document.querySelector('.tervek');
        container.innerHTML = ''; // Kiürítjük, mielőtt feltöltjük

        data.forEach(terv => {
            renderTervItem(terv.id, terv.text, terv.completed);
        });
    }

    // Új terv hozzáadása
    // Új terv hozzáadása
    async function add() {
        const inputField = document.getElementById('tervInput');
        const text = inputField.value.trim();

        if (text === '') return;

        // Beszúrás az adatbázisba
        const { data, error } = await _supabase
            .from('tervek')
            .insert([{ text: text, completed: false }])
            .select();

        if (error) {
            console.error('Hiba a mentéskor:', error);
            return;
        }

        inputField.value = '';
        loadTervek(); // Újratöltjük a listát
    }

    // Egy elem kirajzolása a képernyőre
    function renderTervItem(id, text, isCompleted) {
        const container = document.querySelector('.tervek');

        const itemDiv = document.createElement('div');
        itemDiv.className = 'terv-item';
        if (isCompleted) {
            itemDiv.classList.add('completed');
        }

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = isCompleted;

        const span = document.createElement('span');
        span.textContent = text;

        // Ha változik a pipálás állapota, frissítjük az adatbázisban is
        checkbox.addEventListener('change', async function () {
            const checked = checkbox.checked;

            // Frissítés a Supabase-ben
            const { error } = await _supabase
                .from('tervek')
                .update({ completed: checked })
                .eq('id', id);

            if (error) {
                console.error('Hiba a frissítéskor:', error);
                return;
            }

            // Újratöltjük, hogy a sorrend (alulra/felülre) is frissüljön
            loadTervek();
        });

        itemDiv.appendChild(checkbox);
        itemDiv.appendChild(span);

        // Ha kész, alulra tesszük, ha nem, felülre
        if (isCompleted) {
            container.appendChild(itemDiv);
        } else {
            container.prepend(itemDiv);
        }
    }
</script>

</html>
